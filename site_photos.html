<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 사장님 전용 화면 — 현장견적과 같은 암호(한 번 열면 같이 열림) -->
<script src="/pin-lock.js?v=20261006c" data-key="settleUnlocked"></script>
<title>현장사진 - 섬세한손길</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="현장사진">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/worker/icon-180.png">
<link rel="stylesheet" href="/site_photos.css?v=20261020c">
</head>
<body>

<!-- ① 방문 목록 -->
<section id="listView">
  <header>
    <h1>📷 현장사진</h1>
    <a class="hd-link" href="/quote_pro.html">방문견적 →</a>
  </header>
  <p class="intro"><b>구역설정</b>에서 이 집의 구역을 고르고, 현장에서는 <b>구역만 골라 찍고</b> 나오세요.<br>집에서 사진을 보면서 <b>품목</b>을 고르면, 방문견적서에 그 구역 사진과 품목 체크가 같이 넘어갑니다.</p>
  <button id="newVisit" type="button" class="big primary">＋ 새 현장 방문</button>
  <div id="visits"></div>
  <p id="noVisits" class="empty" hidden>아직 방문한 현장이 없습니다.</p>
</section>

<!-- ② 현장 한 곳 -->
<section id="visitView" hidden>
  <header>
    <button id="backList" type="button" class="hd-btn" aria-label="목록으로">‹</button>
    <h1 id="visitName"></h1>
    <button id="renameVisit" type="button" class="hd-btn" aria-label="이름 바꾸기">✎</button>
  </header>
  <div class="shoot-row">
    <button id="shootBtn" type="button" class="big primary">📷 촬영</button>
    <button id="albumBtn" type="button" class="big">🖼 앨범</button>
    <button id="zoneBtn" type="button" class="big">🧩 구역설정</button>
  </div>
  <label class="size-row">평형
    <select id="sizeSelect" autocomplete="off">
      <option value="확인안됨">확인안됨</option>
      <option value="20평">20평</option>
      <option value="30평">30평</option>
      <option value="40평">40평</option>
      <option value="50평">50평</option>
    </select>
    <small>고르면 몰딩·걸레받이 같은 평형별 품목도 나옵니다</small>
  </label>
  <p id="todo" class="todo" hidden></p>
  <div id="groups"></div>
  <p id="noPhotos" class="empty" hidden>아직 사진이 없습니다. 위의 촬영을 누르세요.</p>
  <div class="bottom-bar">
    <button id="toQuote" type="button" class="big primary">📄 방문견적서로 보내기</button>
  </div>
  <button id="delVisit" type="button" class="del-visit">이 현장 지우기</button>
</section>

<input id="pickFile" type="file" accept="image/*" multiple hidden>
<input id="camFile" type="file" accept="image/*" capture="environment" hidden>

<!-- 인앱 카메라: 셔터를 눌러도 화면이 유지돼 연달아 찍는다 -->
<section id="camSheet" hidden aria-label="촬영">
  <video id="camVideo" playsinline muted></video>
  <!-- 지금 찍는 구역. 고른 채로 계속 찍히고, 다음에 카메라를 열어도 그대로다 -->
  <p id="camZoneNow"></p>
  <div id="camZones" class="chips dark"></div>
  <div id="camBar">
    <button id="camClose" type="button">닫기</button>
    <button id="camShot" type="button" aria-label="촬영"></button>
    <span id="camCount">0장</span>
  </div>
</section>

<!-- 사진 크게 보기 + 구역 고르기 -->
<section id="viewer" hidden aria-label="구역 고르기">
  <div class="vw-top">
    <button id="vwClose" type="button" class="vw-btn">닫기</button>
    <span id="vwPos"></span>
    <button id="vwDel" type="button" class="vw-btn danger">삭제</button>
  </div>
  <div class="vw-img">
    <img id="vwImg" alt="현장 사진">
  </div>
  <div class="vw-panel">
    <p class="vw-q">구역</p>
    <div id="vwZones" class="chips line"></div>
    <p class="vw-q">이 사진의 품목 <small id="vwItemHint"></small></p>
    <div id="vwItems" class="chips items"></div>
    <div class="vw-move">
      <button id="vwPrev" type="button">‹ 이전</button>
      <button id="vwNext" type="button" class="primary">다음 사진 ›</button>
    </div>
  </div>
</section>

<!-- 구역설정: 이 현장에 있는 구역만 고르고, 견적서에 없는 구역은 추가한다 -->
<div id="zoneBack" hidden></div>
<section id="zoneSheet" hidden aria-label="구역설정">
  <p class="vw-q">이 현장의 구역 <small id="zsCount"></small></p>
  <p class="hint zs-hint">고른 구역만 촬영할 때 구역 줄에 나옵니다.</p>
  <div class="zs-tools">
    <button id="zsAll" type="button">전체 고르기</button>
    <button id="zsNone" type="button">전체 해제</button>
  </div>
  <div id="zsMaster" class="chips"></div>
  <p class="vw-q zs-sub">추가한 구역 <small>견적서에 없는 공간 · 집에서 견적서 구역으로 옮깁니다</small></p>
  <div id="zsCustom" class="chips"></div>
  <div class="zs-add">
    <input id="zsName" type="text" placeholder="예: 보일러실, 창고방" autocomplete="off">
    <button id="zsAdd" type="button">＋ 추가</button>
  </div>
  <button id="zsDone" type="button" class="big primary">완료</button>
</section>

<!-- 추가한 구역 → 견적서 구역으로 옮기기 -->
<div id="moveBack" hidden></div>
<section id="moveSheet" hidden aria-label="구역 옮기기">
  <p id="moveTitle" class="vw-q"></p>
  <div id="moveZones" class="chips"></div>
  <button id="moveClose" type="button" class="big">취소</button>
</section>

<div id="toast" hidden></div>

<script src="/quote_photos.js"></script>
<script src="/site_photos_core.js?v=20261020c"></script>
<script src="/site_photos.js?v=20261020c"></script>
<script src="/app-switcher.js?v=20261020a" data-app-id="sitephotos"></script>
</body>
</html>

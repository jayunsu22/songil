<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1분견적 필름찾기</title>
<meta name="description" content="사진 한 장으로 6개사 인테리어필름 2,118개 중 비슷한 색을 찾습니다.">
<meta property="og:title" content="1분견적 필름찾기">
<meta property="og:description" content="사진 한 장으로 6개사 인테리어필름 2,118개 중 비슷한 색을 찾습니다.">
<link rel="stylesheet" href="film_style.css">
</head>
<body>

<header class="top">
  <div class="머리속">
    <h1>1분견적 필름찾기</h1>
    <p class="sub" id="총건수">불러오는 중…</p>

    <!-- 샘플북을 펼친 모양. 색은 지어낸 것이 아니라 DB에서 뽑은 실제 필름 색이다 —
         계열마다 그 계열 L* 의 중앙값에 가장 가까운 제품을 골랐다.
         (화이트·베이지·우드 5톤·그레이·블랙·블루·그린·오렌지·레드)
         JS 로 그리지 않고 여기 박아두는 이유: 화면이 뜨는 즉시 보여야 하는데
         film-db.json 을 기다리면 제목만 뜬 채로 한 박자 늦게 나타난다. -->
    <div class="색부채" aria-hidden="true">
      <span style="--c:#EFEEE7;--h:26px"></span>
      <span style="--c:#D1BA94;--h:31px"></span>
      <span style="--c:#BEA280;--h:36px"></span>
      <span style="--c:#9D6B42;--h:40px"></span>
      <span style="--c:#6B4F3A;--h:36px"></span>
      <span style="--c:#928575;--h:31px"></span>
      <span style="--c:#6B6662;--h:26px"></span>
      <span style="--c:#2B2E35;--h:31px"></span>
      <span style="--c:#14619B;--h:36px"></span>
      <span style="--c:#869B92;--h:31px"></span>
      <span style="--c:#E30A15;--h:26px"></span>
    </div>

    <!-- 연락처는 film_ad.js 의 값으로 채운다 -->
    <a class="연락처" id="연락처" hidden></a>
  </div>
</header>

<main>

  <section class="입구">
    <!-- 1. 코드로 찾기. 코드를 아는 사람이 가장 빠르게 가는 길이라 맨 위에 둔다. -->
    <form class="코드줄" id="코드폼" autocomplete="off">
      <input type="search" id="글자입력" placeholder="필름 넘버 · 팬톤 번호 (예: PS010)"
             inputmode="search" enterkeyhint="search" aria-label="필름 넘버, 색상명 또는 팬톤 번호">
      <button type="submit" class="코드버튼">검색</button>
    </form>

    <!-- 2. 사진으로 찾기. 즐겨찾기와 한 줄에 둔다 -->
    <div class="주요줄">
      <label class="큰버튼" id="사진버튼">
        <input type="file" accept="image/*" id="사진입력" hidden>
        <span class="아이콘" aria-hidden="true">📷</span>
        <span>사진으로 찾기</span>
      </label>
      <button type="button" class="즐겨찾기버튼" id="저장함버튼" hidden></button>
    </div>

  </section>

  <!-- 3. 훑어보기. 색으로 볼지 재질로 볼지 고른다.
       탭줄과 내용을 한 상자 안에 넣는다. 예전에는 버튼과 내용이 따로 놓인 두 상자라
       그 사이가 벌어져 보였다. 한 상자로 만들면 벌어질 틈 자체가 없다.

       두 축을 나눈 이유: 색만으로 훑으면 '화이트' 안에 매끈한 솔리드와 돌 무늬가
       섞여서 나온다. 필름을 고를 때 색과 재질은 따로 정하는 일이 많다. -->
  <section class="훑기">
    <div class="탭줄">
      <div class="탭묶음">
        <button type="button" class="탭 켜짐" id="색탭">🎨 컬러별</button>
        <button type="button" class="탭" id="재질탭">◈ 재질별</button>
      </div>
      <button type="button" class="접기" id="접기버튼" aria-expanded="true" aria-controls="컬러칸" aria-label="접기/펴기">
        <span class="화살" aria-hidden="true">▾</span>
      </button>
    </div>

    <div class="컬러칸" id="컬러칸">
      <!-- 컬러별: 일반색이 먼저, 우드가 아래 -->
      <div class="탭내용" id="색내용">
        <h2 class="묶음제목">일반 색상</h2>
        <div class="분류격자" id="일반격자"></div>
        <h2 class="묶음제목">우드</h2>
        <div class="분류격자 우드격자" id="우드격자"></div>
      </div>
      <!-- 재질별: 우드는 여기 없다. 컬러별의 밝기 5단계가 이미 잘 갈라준다. -->
      <div class="탭내용" id="재질내용" hidden>
        <div class="분류격자 우드격자" id="재질격자"></div>
      </div>
    </div>
  </section>

  <!-- 사진 -->
  <section class="사진칸" id="사진칸" hidden>
    <div class="캔버스감싸기">
      <canvas id="캔버스"></canvas>
      <div class="탭표시" id="탭표시" hidden></div>
      <p class="안내" id="사진안내">사진에서 찾으려는 부분을 눌러보세요</p>
    </div>
    <div class="뽑힌색" id="뽑힌색" hidden>
      <span class="라벨">뽑힌 색</span>
      <span class="칩" id="색칩"></span>
      <code id="색코드"></code>
      <span class="힌트">다시 누르면 갱신</span>
    </div>
  </section>

  <section class="필터" id="필터" hidden></section>

  <!-- 사진·코드 검색 결과 -->
  <section class="결과칸">
    <p class="결과머리" id="결과머리"></p>
    <div class="격자" id="격자"></div>
  </section>

  <!-- 지금까지 찾아본·공유한 필름. 이 폰에만 남는다. -->
  <section class="기록칸" id="기록칸" hidden>
    <div class="기록머리">
      <h2 id="기록제목"></h2>
      <button type="button" class="기록지우기" id="기록지우기">지우기</button>
    </div>
    <div class="격자" id="기록격자"></div>
  </section>

</main>

<!-- 맨 아래 제휴·광고 문의. 내용은 film_ad.js 의 값으로 채운다. -->
<footer class="바닥" id="바닥" hidden></footer>

<!-- 목록 덮개: 분류·즐겨찾기·공유받은 목록을 화면 위에 덮어서 보여준다 -->
<div class="덮개 목록덮개" id="목록덮개" hidden>
  <div class="목록판" id="목록판" role="dialog" aria-modal="true" aria-label="필름 목록"></div>
</div>

<!-- 제품 상세 -->
<div class="덮개 상세덮개" id="덮개" hidden>
  <div class="상세" id="상세" role="dialog" aria-modal="true" aria-label="제품 상세"></div>
</div>

<!-- 카카오톡 공유. JavaScript 키는 원래 공개용이라 소스에 박혀도 되는 값이고,
     대신 developers.kakao.com 에 등록한 웹 도메인에서만 동작한다.
     SDK 를 못 불러와도 공유창의 나머지(링크 복사·문자)는 그대로 동작해야 하므로
     아래 코드는 전부 window.Kakao 존재를 확인하고 쓴다. -->
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.6/kakao.min.js"
        integrity="sha384-WAtVcQYcmTO/N+C1N+1m6Gp8qxh+3NlnP7X1U7qP6P5dQY/MsRBNTh+e1ahJrkEm"
        crossorigin="anonymous"></script>
<script src="/film_color.js"></script>
<script src="/film_match.js"></script>
<script src="film_ad.js"></script>
<script src="film_app.js"></script>
</body>
</html>

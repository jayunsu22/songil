<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1분견적 필름찾기</title>
<meta name="description" content="사진 한 장으로 6개사 인테리어필름 2,118개 중 비슷한 색을 찾습니다.">
<meta property="og:title" content="1분견적 필름찾기">
<meta property="og:description" content="사진 한 장으로 6개사 인테리어필름 2,118개 중 비슷한 색을 찾습니다.">
<link rel="stylesheet" href="film_style.css">
</head>
<body>

<header class="top">
  <h1>1분견적 필름찾기</h1>
  <p class="sub" id="총건수">불러오는 중…</p>
</header>

<main>

  <section class="입구">
    <!-- 1. 코드로 찾기. 코드를 아는 사람이 가장 빠르게 가는 길이라 맨 위에 둔다. -->
    <form class="코드줄" id="코드폼" autocomplete="off">
      <input type="search" id="글자입력" placeholder="필름 넘버를 입력하세요 (예: PS010)"
             inputmode="search" enterkeyhint="search" aria-label="필름 넘버 또는 색상명">
      <button type="submit" class="코드버튼">검색</button>
    </form>

    <!-- 2. 사진으로 찾기. 즐겨찾기와 한 줄에 둔다 -->
    <div class="주요줄">
      <label class="큰버튼" id="사진버튼">
        <input type="file" accept="image/*" id="사진입력" hidden>
        <span class="아이콘" aria-hidden="true">📷</span>
        <span>사진으로 찾기</span>
      </label>
      <button type="button" class="즐겨찾기버튼" id="저장함버튼" hidden></button>
    </div>

    <!-- 3. 컬러별 보기. 첫 화면을 간결하게 두려고 접어둔다. -->
    <button type="button" class="펼침버튼" id="컬러버튼" aria-expanded="false" aria-controls="컬러칸">
      <span class="펼침글">🎨 필름 컬러별 보기</span>
      <span class="화살" aria-hidden="true">▾</span>
    </button>

  </section>

  <!-- 컬러별 보기 내용. 일반색이 먼저, 우드가 아래. 탭 없이 한 화면에 다 보인다. -->
  <section class="컬러칸" id="컬러칸" hidden>
    <h2 class="묶음제목">일반 색상</h2>
    <div class="분류격자" id="일반격자"></div>
    <h2 class="묶음제목">우드</h2>
    <div class="분류격자 우드격자" id="우드격자"></div>
  </section>

  <!-- 사진 -->
  <section class="사진칸" id="사진칸" hidden>
    <div class="캔버스감싸기">
      <canvas id="캔버스"></canvas>
      <div class="탭표시" id="탭표시" hidden></div>
      <p class="안내" id="사진안내">사진에서 찾으려는 부분을 눌러보세요</p>
    </div>
    <div class="뽑힌색" id="뽑힌색" hidden>
      <span class="라벨">뽑힌 색</span>
      <span class="칩" id="색칩"></span>
      <code id="색코드"></code>
      <span class="힌트">다시 누르면 갱신</span>
    </div>
  </section>

  <section class="필터" id="필터" hidden></section>

  <!-- 사진·코드 검색 결과 -->
  <section class="결과칸">
    <p class="결과머리" id="결과머리"></p>
    <div class="격자" id="격자"></div>
  </section>

</main>

<!-- 목록 덮개: 분류·즐겨찾기·공유받은 목록을 화면 위에 덮어서 보여준다 -->
<div class="덮개 목록덮개" id="목록덮개" hidden>
  <div class="목록판" id="목록판" role="dialog" aria-modal="true" aria-label="필름 목록"></div>
</div>

<!-- 제품 상세 -->
<div class="덮개 상세덮개" id="덮개" hidden>
  <div class="상세" id="상세" role="dialog" aria-modal="true" aria-label="제품 상세"></div>
</div>

<!-- 카카오톡 공유. JavaScript 키는 원래 공개용이라 소스에 박혀도 되는 값이고,
     대신 developers.kakao.com 에 등록한 웹 도메인에서만 동작한다.
     SDK 를 못 불러와도 공유창의 나머지(링크 복사·문자)는 그대로 동작해야 하므로
     아래 코드는 전부 window.Kakao 존재를 확인하고 쓴다. -->
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.6/kakao.min.js"
        integrity="sha384-WAtVcQYcmTO/N+C1N+1m6Gp8qxh+3NlnP7X1U7qP6P5dQY/MsRBNTh+e1ahJrkEm"
        crossorigin="anonymous"></script>
<script src="/film_color.js"></script>
<script src="/film_match.js"></script>
<script src="film_app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시공사진</title>
<!-- 카톡 미리보기 카드: Edge Function(partner-og.js)이 ?n= (base64url 현장명)을 읽어 바꿔 넣는다 -->
<meta property="og:title" content="시공사진">
<meta property="og:description" content="섬세한손길 구역별 시공 사진입니다.">
<meta property="og:type" content="website">
<!-- 시공사진 공유 (2026-11-19): 일정 앱 [📷 시공사진] 에서 구역별로 찍은 사진을 업체에 링크로 보여준다.
     /t/<코드> → 이 파일. 사진은 n8n photo-share (공유사진 표) 에서 받는다. 금액·견적은 없다 -->
<style>
  :root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f6f7f9; --accent: #1d4ed8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 18px 16px 14px; }
  header small { display: block; font-size: 12.5px; font-weight: 800; color: var(--accent); letter-spacing: .02em; }
  header h1 { font-size: 21px; font-weight: 900; letter-spacing: -.02em; margin-top: 4px; line-height: 1.3; word-break: keep-all; }
  header p { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
  .jump { position: sticky; top: 0; z-index: 2; background: rgba(246,247,249,.96); backdrop-filter: blur(6px); display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .jump a { flex: 0 0 auto; height: 34px; padding: 0 13px; border-radius: 99px; background: #fff; border: 1px solid var(--line); display: inline-flex; align-items: center; font-size: 14px; font-weight: 800; color: var(--ink); text-decoration: none; }
  .jump a b { color: var(--accent); margin-left: 4px; font-variant-numeric: tabular-nums; }
  main { padding: 6px 12px 40px; max-width: 900px; margin: 0 auto; }
  section { padding-top: 14px; scroll-margin-top: 58px; }
  section h2 { font-size: 17px; font-weight: 900; margin: 0 2px 8px; display: flex; align-items: baseline; gap: 6px; }
  section h2 small { font-size: 13px; color: var(--muted); font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .grid button { aspect-ratio: 3 / 4; border: 0; padding: 0; border-radius: 10px; background: #dfe3ea center / cover no-repeat; cursor: zoom-in; }
  .msg { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 15px; line-height: 1.6; }
  footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 10px 0 30px; }
  #lb { position: fixed; inset: 0; background: #000; z-index: 10; display: flex; flex-direction: column; }
  #lb[hidden] { display: none; }
  #lb .top { display: flex; align-items: center; color: #fff; padding: 12px 14px; font-weight: 800; gap: 10px; }
  #lb .top span { flex: 1; font-size: 15px; }
  #lb .top button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 99px; height: 38px; padding: 0 16px; font-weight: 800; font-size: 15px; }
  #lb .img { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: pan-y pinch-zoom; }
  #lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #lb .nav { display: flex; gap: 10px; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
  #lb .nav button { flex: 1; height: 48px; border-radius: 12px; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 16px; font-weight: 800; }
</style>
</head>
<body>
<header><small>섬세한손길 · 시공사진</small><h1 id="ttl">불러오는 중…</h1><p id="sub"></p></header>
<nav class="jump" id="jump" hidden></nav>
<main id="main"></main>
<footer>사진을 누르면 크게 볼 수 있어요 · 길게 누르면 저장</footer>
<div id="lb" hidden>
  <div class="top"><span id="lbT"></span><button type="button" id="lbX">닫기</button></div>
  <div class="img" id="lbBox"></div>
  <div class="nav"><button type="button" id="lbP">‹ 이전</button><button type="button" id="lbN">다음 ›</button></div>
</div>
<script>
(function () {
  var API = 'https://primary-production-a6fa.up.railway.app/webhook/photo-share';
  var code = (location.pathname.match(/\/t\/([A-Za-z0-9]+)/) || [])[1] || new URLSearchParams(location.search).get('code') || '';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var 구역순서 = ['거실', '주방', '현관', '방1', '방2', '방3', '방4', '방5', '화장실', '베란다', '기타'];
  var 키 = function (z) { var i = 구역순서.indexOf(z); return i < 0 ? 구역순서.length - 0.5 : i; };
  var 모두 = [];
  function 그리기(d) {
    var 사진 = (d && d.사진) || [];
    var 이름 = (d && d.현장명) || '';
    $('ttl').textContent = 이름 || '시공사진';
    document.title = (이름 ? 이름 + ' ' : '') + '시공사진';
    if (!사진.length) { $('sub').textContent = ''; $('main').innerHTML = '<p class="msg">아직 올라온 사진이 없습니다.</p>'; return; }
    var 묶음 = [];
    사진.forEach(function (p) {
      var g = 묶음.filter(function (x) { return x.구역 === p.구역; })[0];
      if (!g) { g = { 구역: p.구역, 사진: [] }; 묶음.push(g); }
      g.사진.push(p);
    });
    묶음.sort(function (a, b) { return 키(a.구역) - 키(b.구역); });
    모두 = [];
    묶음.forEach(function (g) { g.사진.forEach(function (p) { 모두.push(p); }); });
    $('sub').textContent = 묶음.length + '구역 · 사진 ' + 사진.length + '장';
    $('jump').hidden = 묶음.length < 2;
    $('jump').innerHTML = 묶음.map(function (g, i) { return '<a href="#z' + i + '">' + esc(g.구역) + '<b>' + g.사진.length + '</b></a>'; }).join('');
    $('main').innerHTML = 묶음.map(function (g, i) {
      return '<section id="z' + i + '"><h2>' + esc(g.구역) + ' <small>' + g.사진.length + '장</small></h2><div class="grid">' +
        g.사진.map(function (p) { return '<button type="button" data-i="' + 모두.indexOf(p) + '" style="background-image:url(\'' + esc(p.작은 || p.url) + '\')" aria-label="' + esc(g.구역) + ' 사진"></button>'; }).join('') +
        '</div></section>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.grid button'), function (b) { b.addEventListener('click', function () { 열기(Number(b.dataset.i)); }); });
  }
  var 지금 = 0;
  function 열기(i) {
    if (i < 0 || i >= 모두.length) return;
    지금 = i;
    var p = 모두[i];
    $('lbBox').innerHTML = '<img src="' + esc(p.url) + '" alt="' + esc(p.구역) + ' 사진">';
    $('lbT').textContent = p.구역 + ' · ' + (i + 1) + ' / ' + 모두.length;
    $('lb').hidden = false;
  }
  $('lbX').addEventListener('click', function () { $('lb').hidden = true; });
  $('lbP').addEventListener('click', function () { 열기(지금 - 1); });
  $('lbN').addEventListener('click', function () { 열기(지금 + 1); });
  var sx = null;
  $('lbBox').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  $('lbBox').addEventListener('touchend', function (e) { if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) 열기(지금 + (dx < 0 ? 1 : -1)); });
  if (!code) { $('ttl').textContent = '시공사진'; $('main').innerHTML = '<p class="msg">링크가 잘못되었습니다.</p>'; return; }
  fetch(API + '?code=' + encodeURIComponent(code) + '&_t=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(그리기)
    .catch(function () { $('ttl').textContent = '시공사진'; $('main').innerHTML = '<p class="msg">사진을 불러오지 못했습니다.<br>잠시 뒤 다시 열어 주세요.</p>'; });
})();
</script>
</body>
</html>

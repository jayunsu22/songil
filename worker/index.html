<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>현장 품질 관리 시스템</title>
    <!-- 카톡/문자 미리보기 카드용. 실제 현장명은 Edge Function(netlify/edge-functions/partner-og.js)이
         주소의 ?n= (base64url 현장명)을 읽어 아래 줄들을 서버에서 바꿔치기한다.
         미리보기 봇은 JS를 실행하지 않아서, 페이지가 열린 뒤 제목을 바꿔봐야 카드에는 안 나온다.
         (앱이 github.io 에 있던 시절 카드 제목이 늘 "현장 품질 관리 시스템"으로만 떠서
          어느 현장 링크인지 구분이 안 됐던 게 이 페이지를 이리로 옮긴 이유다) -->
    <meta property="og:title" content="현장 품질 관리 시스템">
    <meta property="og:description" content="현장 품질 점검/사진 기록 페이지입니다.">
    <meta property="og:type" content="website">
    <!-- 주소가 /w/<현장코드> 라서 상대경로는 /w/ 기준으로 잡힌다. 반드시 절대경로로 쓸 것. -->
    <link rel="stylesheet" href="/worker/style.css?v=20260918">

    <!-- 홈화면 추가(PWA) 설정: 아이콘/앱 이름/전체화면 모드 -->
    <link rel="manifest" href="/worker/manifest.json">
    <link rel="icon" href="/worker/icon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="/worker/icon-180.png">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="현장품질관리">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loader-container">
            <div class="loader"></div>
            <p id="loadingText">현장 데이터를 불러오는 중...</p>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="toast"></div>

    <!-- 모바일 앱 컨테이너 -->
    <div class="dashboard-container">
        <!-- 헤더 영역 -->
        <header class="dashboard-header">
            <div style="display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
                <h1 class="project-title" id="projectTitle" style="margin-bottom: 0;">현장명 로드 중...</h1>
                <button id="workerRefreshBtn" class="refresh-btn" onclick="location.reload()" title="사장님이 순서/내용을 바꾸셨으면 눌러서 최신 내용으로 새로고침하세요">🔄</button>
                <button id="tempResetBtn" onclick="clearNoticeCache()" style="display: none; padding: 4px 8px; font-size: 11px; font-weight: 800; background: var(--danger); color: white; border: none; border-radius: 6px; cursor: pointer; transition: opacity 0.15s ease;">초기화</button>
            </div>
            <div class="project-date-badge" id="projectDate">시공일자 로드 중...</div>
            <div class="project-address" id="projectAddress">주소 로드 중...</div>
        </header>


        <!-- 기사님 선택 드롭다운 (동적 생성됨) -->
        <div class="worker-select-container">
            <span class="worker-select-icon">👷</span>
            <select id="workerTabs" class="worker-select">
                <!-- <option>홍길동 기사님</option> -->
            </select>
        </div>

        <main class="main-content">
            <!-- 1. 현장 공지사항 (아코디언 토글) -->
            <section class="content-card accordion-card">
                <button class="accordion-header" id="noticeHeader" onclick="toggleAccordion('noticeBody')">
                    <span class="header-title">📢 현장 공지/주의사항</span>
                    <span class="accordion-icon">▼</span>
                </button>
                <div class="accordion-body" id="noticeBody" style="display: none;">
                    <div class="notice-list-container" id="noticeList">
                        <!-- 동적으로 체크박스들이 들어감 -->
                    </div>

                    <button id="noticeReportBtn" class="notice-report-btn" onclick="submitNoticeConfirmation()" style="display: none;">📢 오늘 공지 확인 완료 보고</button>
                </div>

            </section>

            <!-- 2. 시공 품목 품질 점검 섹션 (동적 생성됨) -->
            <section class="section-title">
                <h2>🛠️ 시공 품목 품질 관리</h2>
            </section>
            
            <div id="taskListContainer">
                <!-- 각 품목별 체크리스트와 사진 업로드 카드가 동적 생성됨 -->
                <div class="empty-state">배정된 작업이 없습니다.</div>
            </div>
        </main>
    </div>

    <!-- 모달 팝업 (범용 확인창) -->
    <div id="modalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p id="modalMessage">현재 점검 결과를 제출하시겠습니까?</p>
            <div class="modal-btns">
                <button class="modal-btn-cancel" onclick="closeModal(false)">취소</button>
                <button class="modal-btn-confirm" id="modalConfirmBtn">제출하기</button>
            </div>
        </div>
    </div>

    <!-- 샘플사진 확대보기 -->
    <div id="lightboxOverlay" class="lightbox-overlay" style="display: none;" onclick="closeImageLightbox()">
        <img id="lightboxImage" src="" alt="샘플사진 확대">
    </div>

    <script src="/worker/app.js?v=20260916c"></script>
</body>
</html>

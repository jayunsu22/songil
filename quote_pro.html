<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현장견적 - 섬세한손길</title>
<link rel="stylesheet" href="quote_style.css">
</head>
<body>

<header>
  <input id="siteName" type="text" placeholder="현장명 (예: 레스코 역곡 42평)" autocomplete="off">
  <select id="sizeSelect" aria-label="평형">
    <!-- 확인안됨: 평형을 아직 모를 때. 평형별 품목(몰딩/걸레받이/싱크대)이
         화면에서 빠져서, 모르는 채로 엉뚱한 평형 금액이 들어가는 걸 막는다. -->
    <option value="확인안됨" selected>확인안됨</option>
    <option value="20평">20평</option>
    <option value="30평">30평</option>
    <option value="40평">40평</option>
    <option value="50평">50평</option>
  </select>
  <button id="boxBtn" type="button">저장함</button>
  <button id="resetBtn" type="button">새 견적</button>
</header>

<div id="status">마스터 불러오는 중…</div>

<main id="zones"></main>

<section id="adjWrap" hidden>
  <h2>전체 조정</h2>
  <div class="adj-row"><select class="adj-name" data-slot="0"></select><select class="adj-pct" data-slot="0"></select></div>
  <div class="adj-row"><select class="adj-name" data-slot="1"></select><select class="adj-pct" data-slot="1"></select></div>
  <div class="adj-row"><select class="adj-name" data-slot="2"></select><select class="adj-pct" data-slot="2"></select></div>
  <div id="adjSum"></div>
</section>

<footer id="totalBar">
  <div id="totalAmount">0원</div>
  <button id="publishBtn" type="button" disabled>견적서 발행</button>
</footer>

<div id="pubBack" hidden></div>
<section id="pubSheet" hidden aria-label="견적서 발행">
  <h2>견적서 발행</h2>

  <label class="memo-label" for="memoText">메모 <em>견적서와 카톡에 그대로 나갑니다</em></label>
  <textarea id="memoText" rows="2" placeholder="예: 안방-앞방 연결문 포함 / 실외기실은 방2에 딸림"></textarea>

  <!-- 업자가 자기 고객에게 옮겨 적을 시공범위 안내. 메모와 따로 둔다 -
       메모는 업자에게 하는 말이고, 이건 업자를 거쳐 소비자에게 가는 말이라
       성격이 달라서 한 칸에 섞어 쓰면 업자가 어디까지 전달할지 헷갈린다. -->
  <label class="memo-label" for="relayText">소비자 전달사항 <em>업자가 고객에게 꼭 전달할 시공범위</em></label>
  <textarea id="relayText" rows="3" placeholder="예: 현관문은 안쪽면만 시공합니다.&#10;붙박이장, 싱크대, 샤시는 모두 앞쪽면만 시공합니다."></textarea>

  <label class="opt"><input type="checkbox" id="optDesc" checked>
    <span>품목설명 포함 <em>소비자에게 보낼 때 켜세요</em></span></label>
  <label class="opt"><input type="checkbox" id="optAdj">
    <span>조정내역 표시 <em>소계·조정·합계를 나눠서 보여줍니다</em></span></label>
  <label class="opt"><input type="checkbox" id="optVat" checked>
    <span>부가세 별도 표기</span></label>

  <div id="pubBefore">
    <p class="hint">발행하면 견적서 링크가 만들어집니다. 발행 시점의 금액이 그대로 저장되어,
      나중에 단가를 바꿔도 이미 보낸 견적서는 변하지 않습니다.</p>
    <button id="doPublish" class="primary" type="button">발행하기</button>
  </div>

  <div id="pubAfter" hidden>
    <div id="pubLink"></div>
    <button id="copyLink" class="primary" type="button">링크 복사</button>
    <button id="copyText" type="button">텍스트 복사</button>
    <button id="openLink" type="button">링크 열기</button>
    <button id="rePublish" type="button">고쳐서 다시 발행</button>
    <p class="hint" id="pubNote">‘품목설명 포함’은 지금 켜고 끄면 복사될 링크가 바로 바뀝니다.
      메모·조정내역·부가세를 고쳤으면 <b>다시 발행</b>을 눌러야 반영됩니다.
      이미 보낸 링크는 그대로 살아 있습니다.</p>
  </div>

  <button id="saveDraft" type="button">이 견적 저장함에 담기</button>
  <button id="pubClose" type="button">닫기</button>
</section>

<div id="boxBack" hidden></div>
<section id="boxSheet" hidden aria-label="저장함">
  <h2>저장함</h2>
  <p class="hint">저장해 둔 견적을 불러오면 지금 작성 중인 내용은 대체됩니다.</p>
  <div id="boxList"></div>
  <button id="boxClose" type="button">닫기</button>
</section>

<div id="toast" hidden></div>

<!-- quote_calc.js 가 먼저 로드되어야 한다 (quote_pro.js 가 QuoteCalc 를 쓴다) -->
<script src="quote_calc.js"></script>
<script src="quote_pro.js"></script>
</body>
</html>
